name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm lint

      - name: Build SDK (so the API can resolve `aloy`)
        run: pnpm --filter aloy build

      - name: Typecheck all workspaces
        run: pnpm -r typecheck

  test-sdk:
    name: SDK tests
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SDK tests
        run: pnpm --filter aloy test

      - name: Build SDK
        run: pnpm --filter aloy build

  test-api:
    name: API + integration tests
    runs-on: ubuntu-24.04
    needs: lint-and-typecheck
    # GitHub-hosted ubuntu-24.04 runners ship with Docker pre-installed,
    # which is what `@testcontainers/postgresql` needs to spin up Postgres.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK (the API tests import the built `aloy` package)
        run: pnpm --filter aloy build

      - name: Run API + integration tests
        run: pnpm --filter @aloy/api test
